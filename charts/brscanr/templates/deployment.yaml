apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brscanr.fullname" . }}
  labels:
    {{- include "brscanr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One scanner owner and SQLite writer must survive ordinary rollout changes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "brscanr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brscanr.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: brscanr
          image: {{ include "brscanr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "brscanr.fullname" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: BRSCANR_PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set paperless.existingSecret" .Values.paperless.existingSecret | quote }}
                  key: {{ .Values.paperless.tokenKey | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: callback
              containerPort: {{ .Values.callback.port }}
              protocol: UDP
          volumeMounts:
            - name: spool
              mountPath: /var/lib/brscanr
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: {{ default (include "brscanr.fullname" .) .Values.persistence.existingClaim | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
