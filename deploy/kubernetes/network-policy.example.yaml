# Optional: adjust the printer address and Paperless pod/namespace labels first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brscanr
  namespace: brscanr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: brscanr
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 54925
          protocol: UDP
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 443
          protocol: TCP
        - port: 54921
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
