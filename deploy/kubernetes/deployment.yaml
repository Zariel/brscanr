apiVersion: apps/v1
kind: Deployment
metadata:
  name: brscanr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brscanr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brscanr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brscanr
          image: ghcr.io/zariel/brscanr:main
          envFrom:
            - configMapRef:
                name: brscanr
          ports:
            - name: http
              containerPort: 8080
            - name: callback
              containerPort: 54925
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: spool
              mountPath: /var/lib/brscanr
            - name: paperless
              mountPath: /var/run/secrets/paperless
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: brscanr
        - name: paperless
          secret:
            secretName: brscanr-paperless
