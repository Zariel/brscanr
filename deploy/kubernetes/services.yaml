apiVersion: v1
kind: Service
metadata:
  name: brscanr
spec:
  selector:
    app.kubernetes.io/name: brscanr
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: brscanr-callback
  annotations:
    # Reserve this address in your Cilium LoadBalancer pool before applying.
    lbipam.cilium.io/ips: "198.51.100.50"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: brscanr
  ports:
    - name: callback
      port: 54925
      targetPort: callback
      protocol: UDP
